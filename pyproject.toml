[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyCE"
version = "0.2.0"
description = "A Python library for Configurational Entropy projects"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Damian R Sowinski", email = "drsowinski@gmail.com" }]
# The floor is set by np.trapezoid (used unconditionally in pyCE.math,
# pyCE.bosonstars and pyCE.cosmology.analysis.mps), which needs numpy >= 2.
# The first astropy release that allows numpy 2 is 6.1.0, and its
# requires-python is >=3.10; on 3.9 no resolution satisfies both.
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2",
    "scipy",
    "matplotlib",
    "astropy",
    "tqdm",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/EternalTime/pyCE"
Documentation = "https://damiansowinski.com/pyCE/"

[tool.setuptools.packages.find]
include = ["pyCE*"]

[tool.setuptools.package-data]
"pyCE.cosmology.data" = ["wmap/*.txt"]
